name: Pacote e verificação

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Sintaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monta o zip (pasta gestaoeventos/ pronta para plugins/)
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          mkdir -p dist/gestaoeventos
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/gestaoeventos/
          (cd dist && zip -qr -X "../gestaoeventos-${VERSAO}.zip" gestaoeventos)
      - uses: softprops/action-gh-release@v2
        with:
          files: gestaoeventos-*.zip
          generate_release_notes: true
